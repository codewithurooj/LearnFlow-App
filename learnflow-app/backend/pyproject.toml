[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learnflow-backend"
version = "1.0.0"
description = "LearnFlow AI-powered Python tutoring platform - backend services"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LearnFlow Team", email = "team@learnflow.dev"}
]
dependencies = [
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "openai>=1.12.0,<2.0.0",
    "openai-agents>=0.1.0",
    "dapr>=1.13.0,<2.0.0",
    "dapr-ext-fastapi>=1.13.0,<2.0.0",
    "httpx>=0.26.0,<1.0.0",
    "anyio>=4.0.0,<5.0.0",
    "structlog>=24.1.0,<25.0.0",
    "python-json-logger>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "psutil>=5.9.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
