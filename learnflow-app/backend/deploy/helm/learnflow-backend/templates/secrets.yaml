apiVersion: v1
kind: Secret
metadata:
  name: {{ include "learnflow-backend.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "learnflow-backend.labels" . | nindent 4 }}
type: Opaque
data:
  openai-api-key: {{ .Values.openai.apiKey | b64enc | quote }}
