services:
  - type: web
    name: learnflow-triage
    runtime: docker
    dockerfilePath: ./backend/services/triage/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_NEON
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false

