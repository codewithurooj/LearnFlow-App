# LearnFlow - Local Development Environment
# Usage: docker compose up -d
# Requires: Docker Desktop with Docker Compose v2

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: learnflow
      POSTGRES_USER: learnflow
      POSTGRES_PASSWORD: learnflow_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnflow"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 15s
      timeout: 60s
      retries: 40
      start_period: 180s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 60s
      retries: 40
      start_period: 180s

  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      BETTER_AUTH_SECRET: dev-secret-change-in-production-min32chars
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://learnflow:learnflow_dev@postgres:5432/learnflow
    depends_on:
      postgres:
        condition: service_healthy
      triage:
        condition: service_started

  # ============================================================
  # Backend Microservices
  # ============================================================

  triage:
    build:
      context: ./backend
      dockerfile: services/triage/Dockerfile
    ports:
      - "8001:8001"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: triage-service
      PORT: 8001
      DAPR_HTTP_PORT: 3500
      DAPR_PUBSUB_NAME: pubsub-kafka
      DAPR_STATESTORE_NAME: statestore-postgres
      DATABASE_URL: postgresql://learnflow:learnflow_dev@postgres:5432/learnflow
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  concepts:
    build:
      context: ./backend
      dockerfile: services/concepts/Dockerfile
    ports:
      - "8002:8002"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: concepts-service
      PORT: 8002
      DAPR_HTTP_PORT: 3500
    depends_on:
      postgres:
        condition: service_healthy

  code-runner:
    build:
      context: ./backend
      dockerfile: services/code-runner/Dockerfile
    ports:
      - "8003:8003"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: code-runner-service
      PORT: 8003
      CODE_EXECUTION_TIMEOUT: 5
      CODE_MEMORY_LIMIT_MB: 50
    depends_on:
      kafka:
        condition: service_healthy

  debug:
    build:
      context: ./backend
      dockerfile: services/debug/Dockerfile
    ports:
      - "8004:8004"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: debug-service
      PORT: 8004
      STRUGGLE_ERROR_THRESHOLD: 3
      STRUGGLE_STUCK_MINUTES: 10
    depends_on:
      kafka:
        condition: service_healthy

  exercise:
    build:
      context: ./backend
      dockerfile: services/exercise/Dockerfile
    ports:
      - "8005:8005"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: exercise-service
      PORT: 8005
    depends_on:
      postgres:
        condition: service_healthy

  progress:
    build:
      context: ./backend
      dockerfile: services/progress/Dockerfile
    ports:
      - "8006:8006"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: progress-service
      PORT: 8006
      MASTERY_WEIGHT_EXERCISES: 0.4
      MASTERY_WEIGHT_QUIZZES: 0.3
      MASTERY_WEIGHT_CODE_QUALITY: 0.2
      MASTERY_WEIGHT_STREAK: 0.1
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  code-review:
    build:
      context: ./backend
      dockerfile: services/code-review/Dockerfile
    ports:
      - "8007:8007"
    env_file: ./backend/.env
    environment:
      SERVICE_NAME: code-review-service
      PORT: 8007
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
