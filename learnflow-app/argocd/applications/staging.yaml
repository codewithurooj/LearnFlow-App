apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learnflow-staging
  namespace: argocd
spec:
  project: learnflow
  source:
    repoURL: https://github.com/learnflow/learnflow-app
    targetRevision: main
    path: k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: learnflow-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
