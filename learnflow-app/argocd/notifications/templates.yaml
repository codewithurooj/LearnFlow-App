apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Notification triggers
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  # Notification templates
  template.app-sync-succeeded: |
    message: |
      ✓ Deployment to {{.app.metadata.name}} succeeded
      Application: {{.app.metadata.name}}
      Revision: {{.app.status.sync.revision}}
      Time: {{.app.status.operationState.finishedAt}}
    slack:
      attachments: |
        [{
          "color": "#18be52",
          "title": "✓ {{.app.metadata.name}} - Sync Succeeded",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Revision", "value": "{{.app.status.sync.revision}}", "short": true}
          ]
        }]

  template.app-sync-failed: |
    message: |
      ✗ Deployment to {{.app.metadata.name}} FAILED
      Application: {{.app.metadata.name}}
      Error: {{.app.status.operationState.message}}
    slack:
      attachments: |
        [{
          "color": "#E96D76",
          "title": "✗ {{.app.metadata.name}} - Sync Failed",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Error", "value": "{{.app.status.operationState.message}}", "short": false}
          ]
        }]

  template.app-health-degraded: |
    message: |
      ⚠ {{.app.metadata.name}} health degraded
      Application: {{.app.metadata.name}}
      Health: {{.app.status.health.status}}
    slack:
      attachments: |
        [{
          "color": "#f4c030",
          "title": "⚠ {{.app.metadata.name}} - Health Degraded",
          "fields": [
            {"title": "Application", "value": "{{.app.metadata.name}}", "short": true},
            {"title": "Health Status", "value": "{{.app.status.health.status}}", "short": true}
          ]
        }]

---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
type: Opaque
stringData:
  # Configure Slack webhook URL
  # slack-token: "xoxb-YOUR-SLACK-TOKEN"
  # Configure email
  # email-username: "alerts@learnflow.dev"
  # email-password: "your-email-password"
