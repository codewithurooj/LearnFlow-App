name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ORG: learnflow

permissions:
  contents: write
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python linters
        run: pip install ruff

      - name: Lint Python (backend services)
        run: ruff check .
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint TypeScript (frontend)
        run: npx eslint .
        working-directory: frontend

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Kubernetes manifests
        run: yamllint -d relaxed k8s/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest --cov
        working-directory: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npx vitest run
        working-directory: frontend

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - triage-service
          - concepts-service
          - debug-service
          - code-review-service
          - exercise-service
          - progress-service
          - code-runner
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}:latest

  update-manifests:
    name: Update Staging Manifests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update staging kustomization image tags
        run: |
          cd k8s/overlays/staging
          SERVICES=(
            triage-service
            concepts-service
            debug-service
            code-review-service
            exercise-service
            progress-service
            code-runner
            frontend
          )
          for SERVICE in "${SERVICES[@]}"; do
            sed -i "s|newTag: .*# ${SERVICE}|newTag: sha-${{ steps.sha.outputs.short }} # ${SERVICE}|g" kustomization.yaml
          done
          # Fallback: update all 'latest' tags
          sed -i "s|newTag: latest|newTag: sha-${{ steps.sha.outputs.short }}|g" kustomization.yaml

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore: update staging images to sha-${{ steps.sha.outputs.short }} [skip ci]"
          git push
